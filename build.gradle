//     ].each { killDownloadAssetsFor(it) }
// }
// tasks.matching { it.name.equalsIgnoreCase("downloadAssets") }.configureEach {
//     enabled = false
// }

// 编译编码：保持 UTF-8（Mixin AP 参数 / refmap / reobf 映射由 MixinGradle 自动配置）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Mixin APT：跳过编译期 target 校验（-AdisableTargetValidator）。
    // 本模组的 @ModifyArg 注入点是 Forge patch 版运行时字节码中才存在的调用
    // （如 Player.hurt 内内联的 LivingEntity.hurt），编译期 classpath 为原版字节码，
    // 静态校验会误报 "Cannot resolve any target instructions"；运行时注入不受影响。
    // 注意：禁止使用 remap=false 回避，此方案不涉及 remap。
    options.compilerArgs += ['-AdisableTargetValidator=true']
}
