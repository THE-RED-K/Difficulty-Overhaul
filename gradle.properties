# ============================================================
# 模组构建属性 —— 新建模组时主要修改本文件
# ============================================================

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## 环境版本

# Minecraft 版本必须与 NeoForge 版本匹配才能得到有效产物
minecraft_version=1.21.1
# Minecraft 版本范围（声明于 neoforge.mods.toml）
minecraft_version_range=[1.21.1]
# NeoForge 版本（见 https://projects.neoforged.net/neoforged/neoforge）
# 注意：保持在 21.1.251 以利用本地 Gradle 缓存离线秒装；
# 构建产物在 neoforge.mods.toml 中声明依赖范围 [21.1.251,)，
# 测试服 21.1.252 在该范围内，可正常加载，无需升级构建版本。
neo_version=21.1.251
# NeoForge/FML 加载器主版本范围
loader_version_range=[1,)

## 模组信息（新建模组时主要修改此段）

# 模组 id：全小写英文，须匹配正则 [a-z][a-z0-9_]{1,63}，
# 且与主类 @Mod 注解、源码包路径、neoforge.mods.toml 中的 modId 一致
mod_id=difficulty_overhaul
# 模组显示名称
mod_name=Difficulty Overhaul
# 许可证（参见 https://choosealicense.com/）
mod_license=MIT
# 模组版本（参见 https://semver.org/）
mod_version=1.0.0-1.21.1
# Maven group（建议与源码包基路径一致）
mod_group_id=dev.difficultyoverhaul
# 作者（显示在模组列表）
mod_authors=Difficulty Overhaul Team
# 模组描述（多行可用 \n 换行）
mod_description=扩展原版难度系统：提供 10 种可配置倍率的模式，通过原版难度按钮或 /difficulty 命令切换，所有非和平模式均判定为困难模式以兼容其他模组的困难内容。