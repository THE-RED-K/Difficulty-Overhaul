# ============================================================
# 模组构建属性 —— 新建模组时主要修改本文件
# ============================================================

# 为 Minecraft 反编译/构建过程提供足够内存
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## 环境版本

# Minecraft 版本必须与 Forge 版本匹配才能得到有效产物
minecraft_version=1.20.1
# Minecraft 版本范围（声明于 mods.toml）
minecraft_version_range=[1.20.1,1.21)
# Forge 版本必须与 Minecraft 版本匹配
forge_version=47.4.20
# Forge 版本范围
forge_version_range=[47,)
# Forge/FML 加载器主版本范围
loader_version_range=[47,)

## 映射

# 映射通道：
#   official  - Mojang 官方映射
#   parchment - 社区提供的参数名与 javadoc（基于 official，见 https://parchmentmc.org/docs/getting-started）
mapping_channel=parchment
# 映射版本需与 Minecraft 版本匹配
mapping_version=2023.09.03-1.20.1

## 模组信息（新建模组时主要修改此段）

# 模组 id：全小写英文，须匹配正则 [a-z][a-z0-9_]{1,63}，
# 且与主类 @Mod 注解、源码包路径、META-INF/mods.toml 中的 modId 一致
mod_id=difficulty_overhaul
# 模组显示名称
mod_name=Difficulty Overhaul
# 许可证（参见 https://choosealicense.com/）
mod_license=MIT
# 模组版本（参见 https://semver.org/）
mod_version=1.0.0-1.20.1
# Maven group（建议与源码包基路径一致）
mod_group_id=com.example.difficultyoverhaul
# 作者（显示在模组列表）
mod_authors=Difficulty Overhaul Team
# 模组描述（多行可用 \n 换行）
mod_description=扩展原版难度系统：提供 10 种可配置倍率的模式，通过原版难度按钮或 /difficulty 命令切换，所有非和平模式均判定为困难模式以兼容其他模组的困难内容。
